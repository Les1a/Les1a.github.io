research:
- id: gtisc
  institution: GTISC Lab, Georgia Tech
  role: Ph.D. student
  dates: Jan. 2026 – Present
  description: MetaState adds persistent working-memory augmentation for reasoning across diffusion steps. RoT is an RL-trained latent reasoning framework that modulates decoder layers with an uncertainty-aware estimate of trace-relative reasoning progress. SourceLearn builds reusable, source-specific competence for LLM agents through an external source model.
  works:
  - metastate
  - rot
  - sourcelearn
- id: eic
  institution: EIC Lab, Georgia Tech
  role: Undergraduate to Ph.D. student
  dates: May 2024 – Dec. 2025
  description: Projects study efficient diffusion decoding and long-context memory retention in state space models, including redundancy-aware decoding, soft token interpolation, and token filtering.
  works:
  - longmamba
  - r2-dllm
  - lamb
- id: wuhan-research
  institution: Signal Processing Lab, Wuhan University
  role: Undergraduate student
  dates: Oct. 2023 – Apr. 2024
  description: BRS-E²NeRF uses an event-and-RGB pipeline to jointly address rolling-shutter distortion and motion blur for sharp 3D reconstruction and novel-view synthesis.
  works:
  - brs-e2nerf
industry:
- id: zoom
  institution: Zoom Communications, Inc. · AI Incubation
  role: Research Intern
  dates: May 2026 – Aug. 2026
  description: LookAgain-CUA learns observation boundaries and executes several GUI actions per model call, using multi-action supervision and cost-aware RL. On OSWorld, it reduces model calls and estimated inference cost at comparable task success.
  works:
  - lookagain-cua
- id: bosch
  institution: Bosch Research & Innovation Software Development
  role: Research Intern
  dates: Jul. 2024 – May 2025
  description: D²GS co-optimizes diffusion-based depth generation and 3D Gaussian Splatting for LiDAR-free urban reconstruction, with road-specific geometric constraints and benchmarking on Waymo.
  works:
  - d2gs
