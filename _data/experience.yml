research:
- id: gtisc
  institution: GTISC Lab, Georgia Tech
  role: Ph.D. student
  dates: Jan. 2026 – Present
  description: Developed persistent working-memory augmentation (MetaState) for reasoning across diffusion steps. Proposed an RL-trained latent reasoning framework (RoT) that modulates decoder layers with an uncertainty-aware estimate of reasoning progress. Contributed to a source-learning framework (SourceLearn) that builds reusable, source-specific competence for LLM agents.
  works:
  - metastate
  - rot
  - sourcelearn
- id: eic
  institution: EIC Lab, Georgia Tech
  role: Undergraduate to Ph.D. student
  dates: May 2024 – Feb. 2026
  description: Studied efficient diffusion decoding and long-context memory retention in state space models, including redundancy-aware decoding, soft token interpolation, and token filtering.
  works:
  - r2-dllm
  - longmamba
  - lamb
- id: wuhan-research
  institution: Signal Processing Lab, Wuhan University
  role: Undergraduate student
  dates: Oct. 2023 – Apr. 2024
  description: Developed an event-and-RGB pipeline for BRS-E²NeRF, jointly addressing rolling-shutter distortion and motion blur for sharp 3D reconstruction and novel-view synthesis.
  works:
  - brs-e2nerf
- id: oulu
  institution: CMVS, University of Oulu
  dates: 2023 – 2024
  description: Research on event-based human behavior analysis using spatio-temporal transformers, presented at the IJCAI 2024 MiGA Workshop.
